<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🗾 Mapa de Japón — Busca ciudades</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;font-family:'SF Pro Display','Noto Sans JP',system-ui,sans-serif;background:#1a1a2e}
  #map{position:absolute;inset:0;z-index:1}
  .search-panel{
    position:absolute;top:20px;left:20px;z-index:10;
    width:350px;max-height:85vh;overflow-y:auto;
    background:rgba(18,18,38,0.82);backdrop-filter:blur(16px) saturate(1.3);
    border:1px solid rgba(255,255,255,0.06);border-radius:20px;
    padding:22px 22px 14px;
    color:#e8e8f0;box-shadow:0 24px 72px rgba(0,0,0,0.5);
  }
  .search-panel h1{
    font-size:18px;font-weight:600;letter-spacing:.3px;margin-bottom:6px;
    display:flex;align-items:center;gap:8px;user-select:none;
  }
  .search-panel h1 small{color:#7a7aaa;font-weight:400;font-size:12px}
  .search-box{position:relative;margin:8px 0 4px}
  .search-box input{
    width:100%;padding:11px 14px 11px 38px;
    background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.08);
    border-radius:14px;color:#e8e8f0;font-size:15px;outline:none;transition:.2s;
  }
  .search-box input:focus{
    border-color:rgba(255,180,80,0.35);box-shadow:0 0 0 2px rgba(255,180,80,0.12);
  }
  .search-box .icon{
    position:absolute;left:13px;top:50%;transform:translateY(-50%);
    font-size:16px;opacity:.4;pointer-events:none;
  }
  .city-list{list-style:none;margin-top:4px;max-height:420px;overflow-y:auto;}
  .city-list li{
    padding:9px 12px;cursor:pointer;border-radius:10px;
    display:flex;align-items:center;justify-content:space-between;
    transition:.12s;margin:1px 0;
    border:1px solid transparent;position:relative;
  }
  .city-list li:hover,.city-list li.active{
    background:rgba(255,255,255,0.05);border-color:rgba(255,200,100,0.10);
  }
  .city-list li .name-en{font-size:14px;font-weight:500;color:#f0f0fa}
  .city-list li .name-jp{font-size:12.5px;color:#9999c0}
  .city-list li .pref-region{font-size:11px;color:#6a6a90}
  .city-list li .region-badge{
    display:inline-block;font-size:9px;padding:1px 6px;border-radius:6px;
    background:rgba(255,255,255,0.05);color:#7a7aaa;margin-left:4px;
  }
  .city-list .no-match{
    padding:16px 14px;text-align:center;color:#8888b0;font-size:13px;
  }
  .city-list .hint{
    padding:6px 12px;text-align:center;color:#5a5a80;font-size:11px;
    border-top:1px solid rgba(255,255,255,0.04);margin-top:2px;
  }
  .result-toast{
    position:absolute;bottom:30px;left:50%;transform:translateX(-50%);z-index:10;
    background:rgba(18,18,38,0.75);backdrop-filter:blur(12px);
    padding:8px 22px;border-radius:14px;color:#e8e8f0;font-size:14px;
    border:1px solid rgba(255,255,255,0.05);
    pointer-events:none;opacity:0;transition:opacity .4s ease;white-space:nowrap;
  }
  .result-toast.show{opacity:1}
  .leaflet-popup-content-wrapper{
    border-radius:14px;
    background:rgba(18,18,38,0.88);backdrop-filter:blur(8px);
    color:#e8e8f0;border:1px solid rgba(255,255,255,0.05);
    box-shadow:0 8px 32px rgba(0,0,0,0.35);
  }
  .leaflet-popup-content{margin:10px 16px;font-size:14px;line-height:1.5}
  .leaflet-popup-tip{background:rgba(18,18,38,0.8)}
  .leaflet-control-zoom a{
    background:rgba(18,18,38,0.7);color:#e8e8f0;border-color:rgba(255,255,255,0.06);
  }
  .leaflet-control-attribution{color:#e8e8f0!important}
  .leaflet-control-attribution a{color:#88aaff!important}
  .leaflet-bar a,.leaflet-bar button{
    background:rgba(18,18,38,0.75);color:#e8e8f0;border-color:rgba(255,255,255,0.06);
    width:32px;height:32px;line-height:30px;font-size:18px;
  }
  .leaflet-touch .leaflet-bar a{width:36px;height:36px;line-height:34px;}
  .city-list::-webkit-scrollbar{width:5px}
  .city-list::-webkit-scrollbar-track{background:transparent}
  .city-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:10px}
  @media(max-width:600px){
    .search-panel{width:calc(100% - 28px);left:14px;top:12px;padding:16px 14px 10px;max-height:55vh}
    .search-panel h1{font-size:15px}
    .city-list{max-height:180px}
  }
  @media(max-width:400px){
    .search-panel{top:8px;left:8px;width:calc(100% - 16px);padding:12px 10px}
  }
</style>
</head>
<body>

<div id="map"></div>

<div class="search-panel" id="panel">
  <h1>🗾 Japón <small>centra cualquier ciudad</small></h1>
  <div class="search-box">
    <span class="icon">⌕</span>
    <input type="text" id="searchInput" placeholder="Busca en español, inglés o 日本語…" autocomplete="off" spellcheck="false" />
  </div>
  <ul class="city-list" id="cityList"></ul>
</div>

<div class="result-toast" id="resultToast"></div>

<script>
const CITIES = [
  [35.6762,139.6503,"Tokyo","東京","東京都","Kanto"],
  [35.4437,139.6380,"Yokohama","横浜","神奈川県","Kanto"],
  [35.5304,139.7034,"Kawasaki","川崎","神奈川県","Kanto"],
  [35.8617,139.6453,"Saitama","さいたま","埼玉県","Kanto"],
  [35.6074,140.1064,"Chiba","千葉","千葉県","Kanto"],
  [36.5618,139.8827,"Utsunomiya","宇都宮","栃木県","Kanto"],
  [36.3664,140.4685,"Mito","水戸","茨城県","Kanto"],
  [36.3833,139.0667,"Maebashi","前橋","群馬県","Kanto"],
  [35.6611,138.5680,"Kofu","甲府","山梨県","Kanto"],
  [35.3003,139.5267,"Kamakura","鎌倉","神奈川県","Kanto"],
  [35.2322,139.1000,"Hakone","箱根","神奈川県","Kanto"],
  [34.6937,135.5022,"Osaka","大阪","大阪府","Kansai"],
  [35.0116,135.7681,"Kyoto","京都","京都府","Kansai"],
  [34.6901,135.1955,"Kobe","神戸","兵庫県","Kansai"],
  [34.6851,135.8044,"Nara","奈良","奈良県","Kansai"],
  [35.0172,135.8538,"Otsu","大津","滋賀県","Kansai"],
  [34.2264,135.1676,"Wakayama","和歌山","和歌山県","Kansai"],
  [34.8260,134.6800,"Himeji","姫路","兵庫県","Kansai"],
  [34.7386,135.3570,"Nishinomiya","西宮","兵庫県","Kansai"],
  [34.5733,135.4838,"Sakai","堺","大阪府","Kansai"],
  [34.4875,136.7144,"Ise","伊勢","三重県","Kansai"],
  [35.1815,136.9066,"Nagoya","名古屋","愛知県","Chubu"],
  [34.9767,138.3833,"Shizuoka","静岡","静岡県","Chubu"],
  [34.7108,137.7266,"Hamamatsu","浜松","静岡県","Chubu"],
  [37.9022,139.0236,"Niigata","新潟","新潟県","Chubu"],
  [36.5944,136.6256,"Kanazawa","金沢","石川県","Chubu"],
  [36.6958,137.2136,"Toyama","富山","富山県","Chubu"],
  [36.6434,138.1914,"Nagano","長野","長野県","Chubu"],
  [35.4233,136.7607,"Gifu","岐阜","岐阜県","Chubu"],
  [36.0622,136.2267,"Fukui","福井","福井県","Chubu"],
  [34.7303,136.5088,"Tsu","津","三重県","Chubu"],
  [36.2381,137.9700,"Matsumoto","松本","長野県","Chubu"],
  [36.1475,137.2378,"Takayama","高山","岐阜県","Chubu"],
  [36.3467,138.6000,"Karuizawa","軽井沢","長野県","Chubu"],
  [35.5153,138.7564,"Fujiyoshida","富士吉田","山梨県","Chubu"],
  [43.0621,141.3544,"Sapporo","札幌","北海道","Hokkaido"],
  [41.7687,140.7537,"Hakodate","函館","北海道","Hokkaido"],
  [43.7700,142.3686,"Asahikawa","旭川","北海道","Hokkaido"],
  [38.2681,140.8694,"Sendai","仙台","宮城県","Tohoku"],
  [40.8229,140.7478,"Aomori","青森","青森県","Tohoku"],
  [39.7031,141.1367,"Morioka","盛岡","岩手県","Tohoku"],
  [39.7187,140.1267,"Akita","秋田","秋田県","Tohoku"],
  [38.2551,140.3321,"Yamagata","山形","山形県","Tohoku"],
  [37.4007,140.3740,"Koriyama","郡山","福島県","Tohoku"],
  [37.7600,140.4590,"Fukushima","福島","福島県","Tohoku"],
  [36.7525,139.5036,"Nikko","日光","栃木県","Tohoku"],
  [33.5904,130.4017,"Fukuoka","福岡","福岡県","Kyushu"],
  [33.8833,130.8667,"Kitakyushu","北九州","福岡県","Kyushu"],
  [32.8031,130.7079,"Kumamoto","熊本","熊本県","Kyushu"],
  [31.5601,130.4984,"Kagoshima","鹿児島","鹿児島県","Kyushu"],
  [32.7440,129.8735,"Nagasaki","長崎","長崎県","Kyushu"],
  [33.2383,131.6072,"Oita","大分","大分県","Kyushu"],
  [31.9112,131.4240,"Miyazaki","宮崎","宮崎県","Kyushu"],
  [33.1794,129.7831,"Sasebo","佐世保","長崎県","Kyushu"],
  [34.3853,132.4553,"Hiroshima","広島","広島県","Chugoku"],
  [34.6551,133.9196,"Okayama","岡山","岡山県","Chugoku"],
  [34.5889,133.7731,"Kurashiki","倉敷","岡山県","Chugoku"],
  [33.8392,132.7656,"Matsuyama","松山","愛媛県","Shikoku"],
  [34.3431,134.0474,"Takamatsu","高松","香川県","Shikoku"],
  [34.0701,134.5556,"Tokushima","徳島","徳島県","Shikoku"],
  [33.5589,133.5314,"Kochi","高知","高知県","Shikoku"],
  [26.2123,127.6860,"Naha","那覇","沖縄県","Okinawa"],
].map(a => ({lat:a[0],lng:a[1],en:a[2],jp:a[3],pref:a[4],region:a[5]}));

const map = L.map('map', {center: [36.7, 137.8], zoom: 5.4, zoomControl: true, scrollWheelZoom: true});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution: '© <a href="https://openstreetmap.org/copyright">OpenStreetMap</a>', maxZoom: 19, minZoom: 2}).addTo(map);

const markersLayer = L.layerGroup().addTo(map);
let pulseTimer = null;

function makeIcon(s, c1, c2, gl, bc) {
  return L.divIcon({className: 'city-dot', html: `<div style="width:${s}px;height:${s}px;border-radius:50%;background:radial-gradient(circle at 35% 35%, ${c1}, ${c2});border:2px solid ${bc};box-shadow:0 0 ${gl}px rgba(255,160,50,0.2);"></div>`, iconSize: [s+4,s+4], iconAnchor: [(s+4)/2,(s+4)/2]});
}
function popupHTML(c) {
  return `<div style="text-align:center;min-width:150px"><div style="font-size:20px;font-weight:600;margin-bottom:1px">${c.jp}</div><div style="font-size:14.5px;color:#b0b0d0">${c.en}</div><div style="font-size:12px;color:#6a6a90;margin-top:3px">${c.pref} · ${c.region}</div></div>`;
}

function placeAllMarkers() {
  markersLayer.clearLayers();
  CITIES.forEach(c => {
    const m = L.marker([c.lat,c.lng], {icon: makeIcon(10,'#ff9944','#cc4400',8,'rgba(255,200,100,0.4)')});
    m.bindPopup(popupHTML(c), {className:'city-popup',maxWidth:240,closeButton:true,autoClose:true});
    markersLayer.addLayer(m);
  });
}
placeAllMarkers();

const input = document.getElementById('searchInput');
const list = document.getElementById('cityList');
const toast = document.getElementById('resultToast');
let filtered = CITIES.slice();
let currentIdx = 0;

function normalize(s) { return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

function renderList(cities) {
  filtered = cities; currentIdx = 0;
  if (cities.length === 0) { list.innerHTML = '<li class="no-match">✕ ninguna ciudad coincide</li>'; return; }
  list.innerHTML = cities.map((c,i) => {
    return `<li data-idx="${i}" class="${i===0?'active':''}"><span><span class="name-en">${c.en}</span> <span class="pref-region">${c.pref}</span> <span class="region-badge">${c.region}</span></span><span class="name-jp">${c.jp}</span></li>`;
  }).join('');
  if (cities.length >= CITIES.length * 0.8) list.innerHTML += `<li class="hint">${cities.length} ciudades — escribe para filtrar</li>`;
}

function filterCities(q) {
  if (!q||q.trim()===''){renderList(CITIES);return;}
  const nq = normalize(q).replace(/[\s\-]/g,'');
  const hits = CITIES.filter(c => normalize(c.en+c.jp+c.pref+c.region).replace(/[\s\-]/g,'').indexOf(nq) !== -1);
  renderList(hits);
}

function flyToCity(city) {
  map.setView([city.lat,city.lng], city.region==='Hokkaido'||city.region==='Okinawa'?10:11);
  const pulse = L.marker([city.lat,city.lng], {icon: makeIcon(26,'#ffbb55','#ee5500',22,'rgba(255,255,255,0.7)')});
  pulse.bindPopup(popupHTML(city), {className:'city-popup',maxWidth:240,closeButton:true,autoClose:true});
  markersLayer.addLayer(pulse);
  if(pulseTimer)clearTimeout(pulseTimer);
  pulseTimer = setTimeout(()=>{markersLayer.removeLayer(pulse);pulseTimer=null;},4000);
  toast.textContent = `📍 ${city.jp} (${city.en}) — ${city.pref}`;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),2600);
  const idx = filtered.indexOf(city);
  if(idx>=0){const els=list.querySelectorAll('li[data-idx]');if(els[idx])els[idx].scrollIntoView({block:'center',behavior:'smooth'});}
}

input.addEventListener('input',()=>filterCities(input.value));
input.addEventListener('keydown',e=>{
  if(filtered.length===0)return;
  const items=list.querySelectorAll('li[data-idx]');
  if(items.length===0)return;
  if(e.key==='ArrowDown'){e.preventDefault();items[currentIdx]?.classList.remove('active');currentIdx=Math.min(currentIdx+1,items.length-1);items[currentIdx]?.classList.add('active');items[currentIdx]?.scrollIntoView({block:'nearest'});}
  else if(e.key==='ArrowUp'){e.preventDefault();items[currentIdx]?.classList.remove('active');currentIdx=Math.max(currentIdx-1,0);items[currentIdx]?.classList.add('active');items[currentIdx]?.scrollIntoView({block:'nearest'});}
  else if(e.key==='Enter'&&filtered[currentIdx]){e.preventDefault();flyToCity(filtered[currentIdx]);input.blur();}
  else if(e.key==='Escape'){if(input.value){input.value='';filterCities('');}else{input.blur();}}
});
list.addEventListener('click',e=>{
  const li=e.target.closest('li[data-idx]');if(!li)return;
  const idx=parseInt(li.dataset.idx);
  if(idx>=0&&idx<filtered.length)flyToCity(filtered[idx]);
});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const c=e.key;
  if(c.length===1&&(c.match(/[a-zA-Z0-9]/)||c.charCodeAt(0)>0x2e80))input.focus();
});
renderList(CITIES);
document.head.appendChild(document.createElement('style')).textContent = '.city-dot{background:transparent!important}.leaflet-popup-close-button{color:#fff!important;font-size:18px!important;top:4px!important;right:4px!important;line-height:1!important}';
</script>
</body>
</html>
