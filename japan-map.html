<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMC Codex — Mapa de Japón</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=IBM+Plex+Sans:wght@400;500&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0C0C0C;font-family:'Source Code Pro','IBM Plex Sans',monospace;color:#fff}
  #map{position:absolute;inset:0;z-index:1}
  .leaflet-tile-pane{filter:grayscale(0.6) brightness(0.4) saturate(0.4)}
  .leaflet-tile-pane::after{
    content:'';position:absolute;inset:0;z-index:2;
    background:rgba(12,12,12,0.55);pointer-events:none;
  }
  .leaflet-popup-content-wrapper{
    border-radius:0;background:rgba(12,12,12,0.92);
    border:1px solid rgba(255,255,255,0.08);
    color:#fff;font-family:'Source Code Pro',monospace;
    box-shadow:0 8px 32px rgba(0,0,0,0.6);
  }
  .leaflet-popup-content{margin:14px 18px;font-size:13px;line-height:1.6}
  .leaflet-popup-tip{background:rgba(12,12,12,0.9)}
  .leaflet-popup-close-button{color:rgba(255,255,255,0.4)!important;font-size:18px!important}
  .leaflet-control-zoom a{
    background:rgba(12,12,12,0.7);color:rgba(255,255,255,0.7);
    border-color:rgba(255,255,255,0.05);border-radius:0;
  }
  .leaflet-control-attribution{color:rgba(255,255,255,0.2)!important;font-size:10px!important}
  .leaflet-control-attribution a{color:rgba(255,255,255,0.3)!important}
  #gol-canvas{
    position:absolute;inset:0;z-index:0;
    pointer-events:none;opacity:0.06;width:100%;height:100%;
  }
  #terminal{
    position:absolute;top:0;left:0;z-index:10;
    width:440px;height:100vh;overflow:hidden;
    background:rgba(12,12,12,0.85);backdrop-filter:blur(16px);
    border-right:1px solid rgba(255,255,255,0.04);
    display:flex;flex-direction:column;
    font-family:'Source Code Pro',monospace;
  }
  #terminal .header{
    padding:14px 18px 8px;
    border-bottom:1px solid rgba(255,255,255,0.04);
    display:flex;align-items:center;gap:10px;flex-shrink:0;
  }
  #terminal .header .logo{
    font-family:Outfit,sans-serif;font-weight:800;font-size:13px;
    letter-spacing:0.5px;color:rgba(255,255,255,0.15);
  }
  #terminal .header .logo span{color:rgba(255,255,255,0.4)}
  #terminal .header .status{
    font-size:10px;color:rgba(255,255,255,0.2);margin-left:auto;
  }
  #terminal .header .dot{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:#34D399;margin-right:4px;
  }
  #terminal .prompt-line{
    padding:12px 18px 8px;display:flex;align-items:center;gap:8px;flex-shrink:0;
  }
  #terminal .prompt-line .prompt{
    font-size:13px;color:rgba(255,255,255,0.2);white-space:nowrap;
  }
  #terminal .prompt-line .prompt .user{color:#34D399}
  #terminal .prompt-line .prompt .at{color:rgba(255,255,255,0.3)}
  #terminal .prompt-line .prompt .host{color:#A78BFA}
  #terminal .prompt-line .prompt .dollar{color:rgba(255,255,255,0.4)}
  #terminal .prompt-line input{
    flex:1;background:transparent;border:none;outline:none;
    color:#fff;font-family:'Source Code Pro',monospace;font-size:13px;
    caret-color:#34D399;
  }
  #terminal .prompt-line input::placeholder{color:rgba(255,255,255,0.06)}
  #cityList{
    flex:1;overflow-y:auto;padding:0 10px 10px 18px;scroll-behavior:smooth;
  }
  #cityList::-webkit-scrollbar{width:4px}
  #cityList::-webkit-scrollbar-track{background:transparent}
  #cityList::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08)}
  #cityList .result-row{
    display:block;padding:5px 10px 5px 0;cursor:pointer;
    border:1px solid transparent;border-radius:2px;
    font-size:11.5px;line-height:1.5;
    transition:background 0.12s,border-color 0.12s;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #cityList .result-row:hover,#cityList .result-row.active{
    background:rgba(255,255,255,0.03);border-color:rgba(255,255,255,0.06);
  }
  #cityList .result-row .perms{color:rgba(255,255,255,0.12);margin-right:8px}
  #cityList .result-row .dna{color:rgba(255,255,255,0.3);margin-right:8px;font-size:11px}
  #cityList .result-row .coords{color:rgba(255,255,255,0.12);margin-right:8px;font-size:11px}
  #cityList .result-row .city-name{font-weight:500;font-size:12px}
  #cityList .result-row .city-jp{color:rgba(255,255,255,0.2);margin-left:4px;font-size:11px}
  #cityList .no-match{padding:20px 0;text-align:center;color:rgba(255,255,255,0.1);font-size:12px;}
  #cityList .hint{padding:6px 0;color:rgba(255,255,255,0.06);font-size:10px;text-align:center;}
  #dna-badge{
    position:absolute;bottom:28px;left:18px;z-index:9;
    font-family:'Source Code Pro',monospace;font-size:11px;
    color:rgba(255,255,255,0.15);letter-spacing:0.3px;
    opacity:0;transition:opacity 0.6s ease;pointer-events:none;
  }
  #dna-badge.show{opacity:1}
  #dna-badge .fn{color:rgba(255,255,255,0.12)}
  #dna-badge .paren{color:rgba(255,255,255,0.08)}
  #dna-badge .code-str{color:rgba(255,255,255,0.25)}
  @media(max-width:640px){
    #terminal{width:100%;height:45vh;top:auto;bottom:0;border-right:none;border-top:1px solid rgba(255,255,255,0.04)}
    #cityList .result-row{font-size:10.5px}
    #dna-badge{bottom:46vh;left:12px}
  }
</style>
</head>
<body>
<canvas id="gol-canvas"></canvas>
<div id="map"></div>
<div id="terminal">
  <div class="header">
    <div class="logo">GMC <span>CODEX</span></div>
    <div class="status"><span class="dot"></span> live · 68 cities</div>
  </div>
  <div class="prompt-line">
    <span class="prompt"><span class="user">gmc</span><span class="at">@</span><span class="host">japan</span><span class="dollar">:~$</span></span>
    <input type="text" id="searchInput" placeholder="search city…" autocomplete="off" spellcheck="false" />
  </div>
  <div class="city-list" id="cityList"></div>
</div>
<div id="dna-badge"></div>
<script>
const CATEGORIES = {
  learn:{primary:'#6366F1',spark:'#22D3EE',name:'learn',code:'L'},
  tools:{primary:'#22D3EE',spark:'#F472B6',name:'tools',code:'T'},
  artists:{primary:'#F472B6',spark:'#22D3EE',name:'artists',code:'C'},
  events:{primary:'#A78BFA',spark:'#F472B6',name:'events',code:'E'},
  opportunities:{primary:'#34D399',spark:'#22D3EE',name:'opportunities',code:'O'},
  news:{primary:'#FBBF24',spark:'#F472B6',name:'news',code:'N'},
};
const CITY_CATEGORY = {
  'Kyoto':'learn','Nara':'learn','Nikko':'learn','Ise':'learn',
  'Kamakura':'learn','Hakone':'learn','Matsumoto':'learn','Kofu':'learn',
  'Takayama':'learn','Karuizawa':'learn','Utsunomiya':'learn',
  'Tokyo':'tools','Yokohama':'tools','Osaka':'tools','Nagoya':'tools',
  'Kawasaki':'tools','Saitama':'tools','Chiba':'tools','Hamamatsu':'tools',
  'Gifu':'tools','Fukui':'tools','Kitakyushu':'tools','Sakai':'tools',
  'Kanazawa':'artists','Fujiyoshida':'artists','Kurashiki':'artists',
  'Nishinomiya':'artists','Mito':'artists',
  'Sapporo':'events','Fukuoka':'events','Kobe':'events','Hakodate':'events',
  'Asahikawa':'events','Oita':'events','Kagoshima':'events','Miyazaki':'events',
  'Nagasaki':'events','Sasebo':'events','Otsu':'events','Maebashi':'events',
  'Sendai':'opportunities','Hiroshima':'opportunities','Okayama':'opportunities',
  'Matsuyama':'opportunities','Takamatsu':'opportunities','Tokushima':'opportunities',
  'Kochi':'opportunities','Kumamoto':'opportunities','Toyama':'opportunities',
  'Naha':'news','Niigata':'news','Fukushima':'news','Koriyama':'news',
  'Yamagata':'news','Akita':'news','Aomori':'news','Morioka':'news',
  'Shizuoka':'news','Tsu':'news','Wakayama':'news','Himeji':'news',
};
function makeDNACode(en,catCode,lat,lng){
  const short=en.substring(0,5).toUpperCase().padEnd(5,'·');
  const seed=Math.abs(Math.floor((lat*10000+lng*10000)%9999+1));
  return {code:`${catCode}-${short}-2026-${String(seed).padStart(4,'0')}`,seed};
}
const RAW_CITIES = [
  [35.6762,139.6503,"Tokyo","東京","東京都","Kanto"],
  [35.4437,139.6380,"Yokohama","横浜","神奈川県","Kanto"],
  [35.5304,139.7034,"Kawasaki","川崎","神奈川県","Kanto"],
  [35.8617,139.6453,"Saitama","さいたま","埼玉県","Kanto"],
  [35.6074,140.1064,"Chiba","千葉","千葉県","Kanto"],
  [36.5618,139.8827,"Utsunomiya","宇都宮","栃木県","Kanto"],
  [36.3664,140.4685,"Mito","水戸","茨城県","Kanto"],
  [36.3833,139.0667,"Maebashi","前橋","群馬県","Kanto"],
  [35.6611,138.5680,"Kofu","甲府","山梨県","Kanto"],
  [35.3003,139.5267,"Kamakura","鎌倉","神奈川県","Kanto"],
  [35.2322,139.1000,"Hakone","箱根","神奈川県","Kanto"],
  [34.6937,135.5022,"Osaka","大阪","大阪府","Kansai"],
  [35.0116,135.7681,"Kyoto","京都","京都府","Kansai"],
  [34.6901,135.1955,"Kobe","神戸","兵庫県","Kansai"],
  [34.6851,135.8044,"Nara","奈良","奈良県","Kansai"],
  [35.0172,135.8538,"Otsu","大津","滋賀県","Kansai"],
  [34.2264,135.1676,"Wakayama","和歌山","和歌山県","Kansai"],
  [34.8260,134.6800,"Himeji","姫路","兵庫県","Kansai"],
  [34.7386,135.3570,"Nishinomiya","西宮","兵庫県","Kansai"],
  [34.5733,135.4838,"Sakai","堺","大阪府","Kansai"],
  [34.4875,136.7144,"Ise","伊勢","三重県","Kansai"],
  [35.1815,136.9066,"Nagoya","名古屋","愛知県","Chubu"],
  [34.9767,138.3833,"Shizuoka","静岡","静岡県","Chubu"],
  [34.7108,137.7266,"Hamamatsu","浜松","静岡県","Chubu"],
  [37.9022,139.0236,"Niigata","新潟","新潟県","Chubu"],
  [36.5944,136.6256,"Kanazawa","金沢","石川県","Chubu"],
  [36.6958,137.2136,"Toyama","富山","富山県","Chubu"],
  [36.6434,138.1914,"Nagano","長野","長野県","Chubu"],
  [35.4233,136.7607,"Gifu","岐阜","岐阜県","Chubu"],
  [36.0622,136.2267,"Fukui","福井","福井県","Chubu"],
  [34.7303,136.5088,"Tsu","津","三重県","Chubu"],
  [36.2381,137.9700,"Matsumoto","松本","長野県","Chubu"],
  [36.1475,137.2378,"Takayama","高山","岐阜県","Chubu"],
  [36.3467,138.6000,"Karuizawa","軽井沢","長野県","Chubu"],
  [35.5153,138.7564,"Fujiyoshida","富士吉田","山梨県","Chubu"],
  [43.0621,141.3544,"Sapporo","札幌","北海道","Hokkaido"],
  [41.7687,140.7537,"Hakodate","函館","北海道","Hokkaido"],
  [43.7700,142.3686,"Asahikawa","旭川","北海道","Hokkaido"],
  [38.2681,140.8694,"Sendai","仙台","宮城県","Tohoku"],
  [40.8229,140.7478,"Aomori","青森","青森県","Tohoku"],
  [39.7031,141.1367,"Morioka","盛岡","岩手県","Tohoku"],
  [39.7187,140.1267,"Akita","秋田","秋田県","Tohoku"],
  [38.2551,140.3321,"Yamagata","山形","山形県","Tohoku"],
  [37.4007,140.3740,"Koriyama","郡山","福島県","Tohoku"],
  [37.7600,140.4590,"Fukushima","福島","福島県","Tohoku"],
  [36.7525,139.5036,"Nikko","日光","栃木県","Tohoku"],
  [33.5904,130.4017,"Fukuoka","福岡","福岡県","Kyushu"],
  [33.8833,130.8667,"Kitakyushu","北九州","福岡県","Kyushu"],
  [32.8031,130.7079,"Kumamoto","熊本","熊本県","Kyushu"],
  [31.5601,130.4984,"Kagoshima","鹿児島","鹿児島県","Kyushu"],
  [32.7440,129.8735,"Nagasaki","長崎","長崎県","Kyushu"],
  [33.2383,131.6072,"Oita","大分","大分県","Kyushu"],
  [31.9112,131.4240,"Miyazaki","宮崎","宮崎県","Kyushu"],
  [33.1794,129.7831,"Sasebo","佐世保","長崎県","Kyushu"],
  [34.3853,132.4553,"Hiroshima","広島","広島県","Chugoku"],
  [34.6551,133.9196,"Okayama","岡山","岡山県","Chugoku"],
  [34.5889,133.7731,"Kurashiki","倉敷","岡山県","Chugoku"],
  [33.8392,132.7656,"Matsuyama","松山","愛媛県","Shikoku"],
  [34.3431,134.0474,"Takamatsu","高松","香川県","Shikoku"],
  [34.0701,134.5556,"Tokushima","徳島","徳島県","Shikoku"],
  [33.5589,133.5314,"Kochi","高知","高知県","Shikoku"],
  [26.2123,127.6860,"Naha","那覇","沖縄県","Okinawa"],
].map(a => {
  const en=a[2], catName=CITY_CATEGORY[en]||'learn', cat=CATEGORIES[catName];
  const dna=makeDNACode(en,cat.code,a[0],a[1]);
  return {lat:a[0],lng:a[1],en,jp:a[3],pref:a[4],region:a[5],
          category:catName,catColor:cat.primary,sparkColor:cat.spark,
          dna:dna.code,dnaSeed:dna.seed};
});
function SeededRNG(seed){let s=seed|0;return{next(){s=(s*1664525+1013904223)&0x7FFFFFFF;return(s>>>0)/0x80000000;}};}
const golCanvas=document.getElementById('gol-canvas');
const golCtx=golCanvas.getContext('2d');
let golGrid=[],golRunning=false,golColor='#6366F1',golAnimId=null;
const GOL_CELL=3,GOL_GAP=1,GOL_CELL_STEP=GOL_CELL+GOL_GAP;
let golCols=0,golRows=0,golLastTick=0;
const GOL_INTERVAL=180;
function resizeGoL(){const w=window.innerWidth,h=window.innerHeight;golCanvas.width=w;golCanvas.height=h;golCols=Math.floor(w/GOL_CELL_STEP);golRows=Math.floor(h/GOL_CELL_STEP);}
function seedGoL(seed){const rng=SeededRNG(seed);golGrid=[];for(let y=0;y<golRows;y++){golGrid[y]=[];for(let x=0;x<golCols;x++)golGrid[y][x]=rng.next()>0.5?1:0;}}
function stepGoL(){if(!golGrid.length)return;const ng=[];for(let y=0;y<golRows;y++){ng[y]=[];for(let x=0;x<golCols;x++){let n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(dx===0&&dy===0)continue;const nx=x+dx,ny=y+dy;if(nx>=0&&nx<golCols&&ny>=0&&ny<golRows&&golGrid[ny][nx])n++;}const alive=golGrid[y][x];ng[y][x]=(alive&&(n===2||n===3))||(!alive&&n===3)?1:0;}}golGrid=ng;}
function drawGoL(now){if(!golRunning)return;if(now-golLastTick>=GOL_INTERVAL){stepGoL();golLastTick=now;golCtx.clearRect(0,0,golCanvas.width,golCanvas.height);golCtx.fillStyle=golColor;for(let y=0;y<golRows;y++){for(let x=0;x<golCols;x++){if(golGrid[y][x]){golCtx.globalAlpha=0.015+Math.random()*0.035;golCtx.fillRect(x*GOL_CELL_STEP,y*GOL_CELL_STEP,GOL_CELL,GOL_CELL);}}}golCtx.globalAlpha=1;}golAnimId=requestAnimationFrame(drawGoL);}
function startGoL(seed,color){golColor=color||'#6366F1';resizeGoL();seedGoL(seed||4729);golRunning=true;golLastTick=performance.now();if(golAnimId)cancelAnimationFrame(golAnimId);golAnimId=requestAnimationFrame(drawGoL);}
function stopGoL(){golRunning=false;if(golAnimId){cancelAnimationFrame(golAnimId);golAnimId=null;}golCtx.clearRect(0,0,golCanvas.width,golCanvas.height);}

const map=L.map('map',{center:[36.7,137.8],zoom:5.4,zoomControl:false,scrollWheelZoom:true});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© <a href="https://openstreetmap.org/copyright">OSM</a>',maxZoom:19,minZoom:2}).addTo(map);
L.control.zoom({position:'bottomright'}).addTo(map);
const tilePane=map.getPane('tilePane');
if(tilePane){
  const obs=new MutationObserver(()=>{tilePane.querySelectorAll('img').forEach(img=>{img.style.filter='grayscale(0.5) brightness(0.5) saturate(0.3)';});});
  obs.observe(tilePane,{childList:true,subtree:true});
  tilePane.querySelectorAll('img').forEach(img=>{img.style.filter='grayscale(0.5) brightness(0.5) saturate(0.3)';});
}

const markersLayer=L.layerGroup().addTo(map);
let pulseTimer=null;
function makeIcon(size,color,glow){return L.divIcon({className:'city-dot',html:`<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};border:1px solid rgba(255,255,255,0.15);box-shadow:0 0 ${glow}px ${color};"></div>`,iconSize:[size+4,size+4],iconAnchor:[(size+4)/2,(size+4)/2],});}
function popupHTML(c){return `<div style="text-align:center;font-family:'Source Code Pro',monospace;min-width:160px"><div style="font-size:9px;text-transform:uppercase;letter-spacing:0.5px;color:${c.catColor};margin-bottom:2px">${c.category} · ${c.pref}</div><div style="font-family:Outfit,sans-serif;font-weight:700;font-size:22px;color:#fff;margin:0">${c.jp}</div><div style="font-size:12px;color:rgba(255,255,255,0.5);margin:1px 0 4px">${c.en}</div><div style="font-size:10px;color:rgba(255,255,255,0.15);border-top:1px solid rgba(255,255,255,0.04);padding-top:4px">${c.dna}</div></div>`;}
function placeAllMarkers(){markersLayer.clearLayers();RAW_CITIES.forEach(c=>{const m=L.marker([c.lat,c.lng],{icon:makeIcon(8,c.catColor,4)});m.bindPopup(popupHTML(c),{className:'city-popup',maxWidth:240,closeButton:true,autoClose:true});markersLayer.addLayer(m);});}
placeAllMarkers();
const CITIES=RAW_CITIES;

const input=document.getElementById('searchInput');
const list=document.getElementById('cityList');
const dnaBadge=document.getElementById('dna-badge');
let filtered=CITIES.slice();
let currentIdx=0;
function normalize(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function formatRow(c,i,active){
  const perms='-rw-r·r·';
  return `<span class="result-row ${active?'active':''}" data-idx="${i}"><span class="perms">${perms}</span><span class="dna" style="color:${c.catColor}">${c.dna}</span><span class="coords" style="color:${c.catColor}">${c.lat.toFixed(3)} ${c.lng.toFixed(3)}</span><span class="city-name" style="color:${c.catColor}">${c.en}</span><span class="city-jp">${c.jp}</span><span style="font-size:10px;color:rgba(255,255,255,0.08);margin-left:4px">${c.pref}</span></span>`;
}
function renderList(cities){filtered=cities;currentIdx=0;if(!cities.length){list.innerHTML='<div class="no-match">∅ no cities match</div>';return;}list.innerHTML=cities.map((c,i)=>formatRow(c,i,i===0)).join('');if(cities.length>=CITIES.length*0.8)list.innerHTML+=`<div class="hint">${cities.length} entries · type to filter</div>`;}
function filterCities(q){if(!q||!q.trim()){renderList(CITIES);return;}const nq=normalize(q).replace(/[\s\-]/g,'');const hits=CITIES.filter(c=>normalize(c.en+c.jp+c.pref+c.region+c.dna).replace(/[\s\-]/g,'').indexOf(nq)!==-1);renderList(hits);}
function flyToCity(city){
  const zoom=(city.region==='Hokkaido'||city.region==='Okinawa')?10:11;
  map.setView([city.lat,city.lng],zoom);
  if(pulseTimer){clearTimeout(pulseTimer);pulseTimer=null;}
  const pulse=L.marker([city.lat,city.lng],{icon:makeIcon(22,city.catColor,14)});
  pulse.bindPopup(popupHTML(city),{className:'city-popup',maxWidth:240,closeButton:true,autoClose:true});
  markersLayer.addLayer(pulse);
  pulseTimer=setTimeout(()=>{markersLayer.removeLayer(pulse);pulseTimer=null;},4000);
  dnaBadge.innerHTML=`<span class="fn">gmcSeed</span><span class="paren">(</span><span class="code-str">"${city.dna}"</span><span class="paren">)</span>;`;
  dnaBadge.classList.add('show');
  const idx=filtered.indexOf(city);
  if(idx>=0){const els=list.querySelectorAll('.result-row');if(els[idx])els[idx].scrollIntoView({block:'center',behavior:'smooth'});}
  golColor=city.catColor;
}
input.addEventListener('input',()=>filterCities(input.value));
list.addEventListener('click',e=>{const row=e.target.closest('.result-row');if(!row||!row.dataset.idx)return;const idx=parseInt(row.dataset.idx);if(idx>=0&&idx<filtered.length)flyToCity(filtered[idx]);});
input.addEventListener('keydown',e=>{
  if(filtered.length===0)return;
  const items=list.querySelectorAll('.result-row');
  if(!items.length)return;
  if(e.key==='ArrowDown'){e.preventDefault();items[currentIdx]?.classList.remove('active');currentIdx=Math.min(currentIdx+1,items.length-1);items[currentIdx]?.classList.add('active');items[currentIdx]?.scrollIntoView({block:'nearest'});}
  else if(e.key==='ArrowUp'){e.preventDefault();items[currentIdx]?.classList.remove('active');currentIdx=Math.max(currentIdx-1,0);items[currentIdx]?.classList.add('active');items[currentIdx]?.scrollIntoView({block:'nearest'});}
  else if(e.key==='Enter'&&filtered[currentIdx]){e.preventDefault();flyToCity(filtered[currentIdx]);input.blur();}
  else if(e.key==='Escape'){if(input.value){input.value='';filterCities('');}else input.blur();}
});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(e.ctrlKey||e.metaKey||e.altKey)return;const c=e.key;if(c.length===1&&(c.match(/[a-zA-Z0-9]/)||c.charCodeAt(0)>0x2e80))input.focus();});
renderList(CITIES);
const today=new Date();const dailySeed=today.getFullYear()*10000+(today.getMonth()+1)*100+today.getDate();
startGoL(dailySeed,'#6366F1');
window.addEventListener('resize',()=>{resizeGoL();seedGoL(dailySeed);});
document.head.appendChild(document.createElement('style')).textContent='.city-dot{background:transparent!important}.leaflet-popup-close-button{color:rgba(255,255,255,0.3)!important;top:4px!important;right:4px!important;line-height:1!important;font-size:16px!important}';
</script>
